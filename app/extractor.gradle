import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

// Fetch the Vanilla Archive!
// Checks for `apks`, `apkm` and `xapk`
def findVanillaArchive = {
	def exts = [".apks", ".apkm", ".xapk"]
	def matches = rootDir.listFiles({ d, name ->
		def lower = name.toLowerCase()
		return lower.startsWith("vanilla") && exts.any { lower.endsWith(it) } && new File(d, name).isFile()
	} as FilenameFilter)
	return (matches && matches.length > 0) ? matches[0] : null
}

tasks.register('extractVanillaApk') {
	description = "Extracts a Vanilla APK into the build dir."

	onlyIf {
		def buildDir = layout.buildDirectory.get().asFile
		def vd = file("${buildDir}/vanilla")
		return !vd.exists() || !vd.isDirectory() || (vd.list().length == 0)
	}

	doLast {
		def buildDir = layout.buildDirectory.get()
		def extractDir = file("${buildDir}/vanilla")
		def archive = findVanillaArchive()

		if (!archive || !archive.exists() || !archive.isFile()) {
			throw new GradleException("Vanilla archive not found in project root...")
		}

		println "Using archive: ${archive.absolutePath}"
		println "Extracting to ${extractDir}"

		FileHelper.unzipArchive(archive, extractDir)

		def innerApks = []
		extractDir.eachFileRecurse { f ->
			if (f.isFile() && f.name.toLowerCase().endsWith(".apk")) {
				innerApks.add(f)
			}
		}

		for (apk in innerApks) {
			FileHelper.unzipArchive(apk, extractDir)
		}
	}
}

tasks.register('copyVanillaLibs') {
	description = "Copies the vanilla .so files into the source tree"
	dependsOn "extractVanillaApk"

	doLast {
		def buildDir = layout.buildDirectory.get()
		def apk = file("${buildDir}/vanilla")

		def target32 = file("src/main/jniLibs/armeabi-v7a")
		def target64 = file("src/main/jniLibs/arm64-v8a")

		Files.createDirectories(target32.toPath())
		Files.createDirectories(target64.toPath())

		// This is like a powerful local function...
		def locateLib = { List<String> dirKeywords, String libName ->
			for (keyword in dirKeywords) {
				def direct = file("${apk}/${keyword}/${libName}")
				if (direct.exists() && direct.isFile()) return direct
			}
			File found = null
			apk.eachFileRecurse { f ->
				if (f.name == libName) {
					def p = f.absolutePath.toLowerCase()
					for (keyword in dirKeywords) {
						if (p.contains(keyword.toLowerCase())) {
							found = f
							return
						}
					}
				}
			}
			return found
		}

		def arm64OpenAl = locateLib(["arm64-v8a", "arm64"], "libopenal-soft.so")
		def arm64Swordigo = locateLib(["arm64-v8a", "arm64"], "libswordigo.so")
		def arm32OpenAl = locateLib(["armeabi-v7a", "armeabi"], "libopenal-soft.so")
		def arm32Swordigo = locateLib(["armeabi-v7a", "armeabi"], "libswordigo.so")

		if (arm64OpenAl) Files.copy(arm64OpenAl.toPath(), file("${target64}/libopenal-soft.so").toPath(), StandardCopyOption.REPLACE_EXISTING)
		if (arm64Swordigo) Files.copy(arm64Swordigo.toPath(), file("${target64}/libswordigo.so").toPath(), StandardCopyOption.REPLACE_EXISTING)
		if (arm32OpenAl) Files.copy(arm32OpenAl.toPath(), file("${target32}/libopenal-soft.so").toPath(), StandardCopyOption.REPLACE_EXISTING)
		if (arm32Swordigo) Files.copy(arm32Swordigo.toPath(), file("${target32}/libswordigo.so").toPath(), StandardCopyOption.REPLACE_EXISTING)
	}
}

tasks.register('copyVanillaResources') {
	description = "Copies the vanilla resource files into the source tree"
	dependsOn "extractVanillaApk"

	doLast {
		def buildDir = layout.buildDirectory.get()
		def apk = file("${buildDir}/vanilla")

		Files.createDirectories(file("src/main/assets/resources/").toPath())

		def resDir = file("${apk}/assets/resources")
		if (resDir.exists()) {
			FileHelper.copyDirectory(resDir, file("src/main/assets/resources/"))
		}

		def readme = file("${apk}/assets/README")
		if (readme.exists()) {
			Files.copy(readme.toPath(), file("src/main/assets/README").toPath(), StandardCopyOption.REPLACE_EXISTING)
		}
	}
}

tasks.register('copyVanillaMusic') {
	description = "Copies the vanilla music into the source tree"
	dependsOn "extractVanillaApk"

	onlyIf {
		def musicFolder = file("src/main/assets/music/")
		return !musicFolder.exists() || !musicFolder.isDirectory() || (musicFolder.list().length != 9)
	}

	doLast {
		def buildDir = layout.buildDirectory.get()
		def apk = file("${buildDir}/vanilla")

		Files.createDirectories(file("src/main/assets/music/").toPath())

		def musicMap = Map.of(
			"1f49b4ac4f5f642ed2eb0428dad0ae77d62c7cd344785eeb078616f404f4864a", "1_dung73.mp3",
			"346f67ee88d9c5ed4b6660750a6d5b34867312c24fb85c8c18758e7cd447773a", "1_hero2.mp3",
			"352028e55025507ba9655ae8f6cd48f62886b6d9404aff944c5fdfb4e63216fb", "squire_new2.mp3",
			"7609232f8f2223a65d35a6a6bc974284c2801aabcfa6ec2a554654a3341ddd99", "1_plaintest2.mp3",
			"975136dc23510b71e8f7d6a5b96af8a1505b9885781c6064cfd73eaa5fa7d216", "momentofwonder.mp3",
			"af8486c1bf84e8bfe5d08345f751ec05896e218e477b3c3a3f1039404fe8565b", "2cave2.mp3",
			"c6d0a727c038f0eb647b5cfebc8d0cb4e52f46db2364b333d7210952c7271f65", "heartbeat.mp3",
			"ece3ccbfd6a44b95a1c8bbe7294d42c1ca3231ca6271723bc08ca53c5c6a67cb", "gameover.mp3",
			"eea51816eb5fd4cb85fcc7b86c70b620f5d2ed6bac369f8036843946d3486dfc", "1_boss23.mp3"
		)

		def res = file("${apk}/res")
		if (res.exists()) {
			res.eachFileRecurse { File f ->
				if (f.isDirectory()) return
				def sha256 = MessageDigest.getInstance("SHA-256").digest(f.bytes).encodeHex().toString()
				if (musicMap.containsKey(sha256)) {
					Files.copy(
						f.toPath(),
						file("src/main/assets/music/${musicMap.get(sha256)}").toPath(),
						StandardCopyOption.REPLACE_EXISTING
					)
				}
			}
		}
	}
}

tasks.register('extractVanilla') {
	description = "Meta-task to prepare the entire source tree with a copy of vanilla."

	dependsOn "copyVanillaLibs"
	dependsOn "copyVanillaResources"
	dependsOn "copyVanillaMusic"
}

tasks.register('cleanVanilla') {
	description = "Deletes all the files that Vanilla Extraction leaves behind."
	doLast {
		def buildDir = layout.buildDirectory.get()

		def apk = file("${buildDir}/vanilla")
		def jniLibs = file("src/main/jniLibs")
		def libs = file("libs")

		def music = file("src/main/assets/music")
		def resources = file("src/main/assets/resources")
		def readme = file("src/main/assets/README")

		FileHelper.deleteDirectoryIfExists(apk)
		FileHelper.deleteDirectoryIfExists(jniLibs)
		FileHelper.deleteDirectoryIfExists(libs)

		FileHelper.deleteDirectoryIfExists(music)
		FileHelper.deleteDirectoryIfExists(resources)
		FileHelper.deleteFileIfExists(readme)
	}
}
